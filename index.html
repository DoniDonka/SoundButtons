<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soundboard Supreme</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080a0f;
            --surface: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --accent: #00e5ff;
            --accent-dim: rgba(0,229,255,0.12);
            --accent-glow: 0 0 20px rgba(0,229,255,0.35);
            --danger: #ff4757;
            --warning: #ffc800;
            --success: #22c55e;
            --text: #e8eaf0;
            --muted: #4a5068;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            background-image:
                radial-gradient(ellipse 60% 40% at 20% 0%, rgba(0,229,255,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 40% 30% at 80% 100%, rgba(0,100,200,0.05) 0%, transparent 50%);
        }

        /* ── JOIN OVERLAY ── */
        #join-screen {
            position: fixed;
            inset: 0;
            background: rgba(8,10,15,0.97);
            backdrop-filter: blur(24px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 28px;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        #join-screen .big-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(48px, 8vw, 80px);
            letter-spacing: 4px;
            color: var(--accent);
            text-shadow: var(--accent-glow);
            text-align: center;
            line-height: 1;
        }

        .note-badge {
            background: rgba(255,200,0,0.1);
            border: 1px solid rgba(255,200,0,0.3);
            color: var(--warning);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .join-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 18px 52px;
            border-radius: 12px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: var(--accent-glow);
            transition: all 0.25s ease;
        }

        .join-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 35px rgba(0,229,255,0.55);
        }

        /* ── MAIN LAYOUT ── */
        .app {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .app-header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 36px;
            letter-spacing: 3px;
            color: var(--accent);
            text-shadow: var(--accent-glow);
        }

        .live-dot {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .live-dot::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
            animation: blink 1.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ── PANELS ── */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }

        /* ── NOW PLAYING ── */
        .now-playing {
            border-left: 3px solid var(--accent);
            position: relative;
            overflow: hidden;
        }

        .now-playing::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent-dim) 0%, transparent 60%);
            pointer-events: none;
        }

        .np-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 8px;
        }

        #np-title {
            font-size: 22px;
            font-weight: 600;
            line-height: 1.3;
            min-height: 30px;
        }

        /* countdown badge shown when delay is active */
        #delay-countdown {
            display: none;
            margin-top: 8px;
            font-size: 13px;
            color: var(--warning);
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* ── CONTROLS ── */
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 90px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 14px;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.09);
            border-color: var(--accent);
            box-shadow: var(--accent-glow);
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .btn-resume {
            background: rgba(34,197,94,0.1);
            border-color: rgba(34,197,94,0.3);
            color: var(--success);
        }

        .btn-resume:hover:not(:disabled) {
            background: rgba(34,197,94,0.25);
            border-color: var(--success);
            box-shadow: 0 0 16px rgba(34,197,94,0.3);
        }

        .btn-stop {
            background: rgba(255,71,87,0.08);
            border-color: rgba(255,71,87,0.25);
            color: var(--danger);
        }

        .btn-stop:hover:not(:disabled) {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
            box-shadow: 0 0 20px rgba(255,71,87,0.4);
        }

        .btn-delay {
            background: rgba(255,200,0,0.08);
            border-color: rgba(255,200,0,0.25);
            color: var(--warning);
        }

        .btn-delay:hover:not(:disabled) {
            background: rgba(255,200,0,0.2);
            border-color: var(--warning);
        }

        .btn-delay.active {
            background: rgba(255,200,0,0.2);
            border-color: var(--warning);
            animation: pulse-warn 1.5s infinite;
        }

        @keyframes pulse-warn {
            0%, 100% { box-shadow: 0 0 0 rgba(255,200,0,0); }
            50% { box-shadow: 0 0 12px rgba(255,200,0,0.4); }
        }

        /* ── DELAY MODAL ── */
        #delay-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(8,10,15,0.85);
            backdrop-filter: blur(16px);
            z-index: 8888;
            justify-content: center;
            align-items: center;
        }

        #delay-modal.open { display: flex; }

        .modal-box {
            background: #0f1119;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            width: 90%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal-box h3 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 26px;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .modal-box p {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
        }

        .delay-presets {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .preset-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .preset-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .custom-delay-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .custom-delay-row input {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 16px;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            outline: none;
        }

        .custom-delay-row input:focus { border-color: var(--accent); }
        .custom-delay-row input::placeholder { color: var(--muted); }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .btn-modal-cancel {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 12px;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-modal-cancel:hover { border-color: var(--text); color: var(--text); }

        .btn-modal-confirm {
            flex: 2;
            background: var(--warning);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-modal-confirm:hover { filter: brightness(1.1); }

        /* ── INPUT ── */
        .section-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--muted);
            font-weight: 600;
            margin-bottom: 14px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 14px 18px;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: var(--accent-glow);
        }

        input::placeholder { color: var(--muted); }

        .btn-add {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-add:hover { filter: brightness(1.15); box-shadow: var(--accent-glow); }
        .btn-add:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ── QUEUE ── */
        #queue-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }

        #queue-list::-webkit-scrollbar { width: 4px; }
        #queue-list::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

        #queue-list li {
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 13px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .q-num { color: var(--muted); font-size: 12px; font-weight: 600; min-width: 20px; }
        .q-title { flex: 1; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .q-empty { text-align: center; color: var(--muted); font-size: 14px; padding: 20px; list-style: none; }

        /* Hidden YT player */
        .yt-hidden {
            position: fixed;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            bottom: 0; right: 0;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>

<!-- JOIN OVERLAY -->
<div id="join-screen">
    <div class="big-title">SOUNDBOARD<br>SUPREME</div>
    <div class="note-badge">🔊 Turn your volume up before joining!</div>
    <button id="join-btn" class="join-btn">CONNECT AUDIO</button>
</div>

<!-- DELAY MODAL -->
<div id="delay-modal">
    <div class="modal-box">
        <h3>⏱ Set Delay</h3>
        <p>Choose how long to wait before the next queued sound plays.</p>
        <div class="delay-presets">
            <button class="preset-btn" data-seconds="10">10 sec</button>
            <button class="preset-btn" data-seconds="30">30 sec</button>
            <button class="preset-btn" data-seconds="60">1 min</button>
            <button class="preset-btn" data-seconds="120">2 min</button>
            <button class="preset-btn" data-seconds="300">5 min</button>
            <button class="preset-btn" data-seconds="600">10 min</button>
        </div>
        <div class="custom-delay-row">
            <input type="text" id="custom-delay-input" placeholder="Custom (seconds)">
        </div>
        <div class="modal-actions">
            <button class="btn-modal-cancel" id="delay-cancel">Cancel</button>
            <button class="btn-modal-confirm" id="delay-confirm">Set Delay</button>
        </div>
    </div>
</div>

<!-- MAIN APP -->
<div class="app">
    <div class="app-header">
        <h1>SOUNDBOARD SUPREME</h1>
        <div class="live-dot">Live</div>
    </div>

    <!-- Now Playing -->
    <div class="panel now-playing">
        <div class="np-label">▶ Now Playing</div>
        <div id="np-title">Silence...</div>
        <div id="delay-countdown"></div>
        <div class="controls">
            <button id="btn-play" class="btn">▶ Play</button>
            <button id="btn-pause" class="btn">⏸ Pause</button>
            <button id="btn-resume" class="btn btn-resume">↺ Resume</button>
            <button id="btn-skip" class="btn">⏭ Skip</button>
            <button id="btn-stop" class="btn btn-stop">⏹ Stop</button>
            <button id="btn-delay" class="btn btn-delay">⏱ Delay</button>
        </div>
    </div>

    <!-- Add to Queue -->
    <div class="panel">
        <div class="section-label">Add Sound</div>
        <div class="input-row">
            <input type="text" id="yt-link" placeholder="Paste a YouTube link...">
            <button id="queue-btn" class="btn-add">Add to Queue</button>
        </div>
    </div>

    <!-- Queue -->
    <div class="panel">
        <div class="section-label">Up Next</div>
        <ul id="queue-list">
            <li class="q-empty">Queue is empty</li>
        </ul>
    </div>
</div>

<!-- Hidden YT Player — MUST be visible to browser (opacity trick) -->
<div class="yt-hidden">
    <div id="player"></div>
</div>

<!--
    CRITICAL LOAD ORDER:
    1. app.js as a module (registers window.onYouTubeIframeAPIReady)
    2. YouTube IFrame API (calls window.onYouTubeIframeAPIReady when ready)
-->
<script type="module" src="app.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
