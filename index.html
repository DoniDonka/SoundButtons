<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Audio Telemetry</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="join-modal" class="modal-overlay active">
        <div class="modal-content">
            <h2 style="color: var(--danger); margin-bottom: 10px;">AUDIO SUBSYSTEM OFFLINE</h2>
            <p style="color: var(--text-muted); margin-bottom: 30px;">Browser policy requires manual activation. Ensure
                volume is turned up before initializing.</p>
            <button id="join-btn" class="btn-primary" style="width: 100%; font-size: 1.2rem;">Initialize Audio
                Protocol</button>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">System Preferences</h2>
            <div style="text-align: left; margin-bottom: 20px;">
                <label class="status-label">UI Theme</label>
                <select id="theme-selector">
                    <option value="default">ETS2 Night Drive (Cyan)</option>
                    <option value="amber-telemetry">Amber Dashboard (Orange)</option>
                    <option value="stealth-red">Stealth Protocol (Red)</option>
                </select>
            </div>
            <button id="close-settings" class="btn-secondary" style="width: 100%;">Save & Close</button>
        </div>
    </div>

    <div class="glass-panel">
        <header>
            <div class="sys-title">Audio Telemetry Unit</div>
            <button id="open-settings" class="btn-secondary">⚙️ Settings</button>
        </header>

        <div id="status-box" class="status-display">
            <span class="status-label">Now Broadcasting</span>
            <span id="np-title" class="status-track">Awaiting Input...</span>
            <div class="audio-waves"></div>
        </div>

        <div class="control-group">
            <input type="text" id="yt-link" placeholder="Enter YouTube URL...">
            <button id="queue-btn" class="btn-primary">Transmit ⚡</button>
        </div>

        <h3 class="status-label"
            style="margin-top: 30px; border-bottom: 1px solid var(--panel-border); padding-bottom: 10px;">Transmission
            Queue</h3>
        <ul id="queue-list"></ul>
    </div>

    <div id="player" style="display: none;"></div>

    <script type="module" src="app.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>

</html>
