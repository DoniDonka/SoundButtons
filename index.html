<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Soundboard</title>
    <style>
        body { font-family: sans-serif; background: #222; color: white; text-align: center; padding: 50px; }
        #join-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #ff0000; color: white; border: none; border-radius: 5px; }
        input { padding: 10px; width: 300px; font-size: 16px; }
        .warning { color: yellow; font-weight: bold; font-size: 20px; }
        #player { display: none; } /* Hides the actual video */
    </style>
</head>
<body>

    <div id="join-screen">
        <h1 class="warning">MAKE SURE TO HAVE FULL VOLUME ON!</h1>
        <button id="join-btn">Click to Join Room & Enable Audio</button>
    </div>

    <h1>Soundboard Queue</h1>
    <div>
        <input type="text" id="yt-link" placeholder="Paste YouTube Link Here...">
        <button id="queue-btn">Add to Queue</button>
    </div>
    
    <h2>Up Next:</h2>
    <ul id="queue-list" style="list-style: none; padding: 0;"></ul>

    <div id="player"></div>

    <script type="module" src="app.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
